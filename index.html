<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trevor Welsh</title>
  <meta name="description" content="Trevor Welsh designs and builds iOS apps, including L8R, GoFly, and Sunny." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 500;
      color: #1d1d1f;
    }

    .hero {
      height: 100vh;
      padding: 0 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    h1 {
      font-size: 11.25vw;
      font-weight: 500;
      color: #1d1d1f;
      line-height: 1;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .intro {
      font-size: 24px;
      font-weight: 400;
      color: #6e6e73;
      max-width: 640px;
      line-height: 1.4;
    }

    .apps {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 64px;
    }

    .section-label {
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1f;
    }

    .app-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .app-row {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 24px;
      background: #f5f5f7;
      border-radius: 24px;
      corner-shape: squircle;
      text-decoration: none;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-row:hover { transform: scale(1.015); }

    .app-icon {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.12));
    }

    .app-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .app-name {
      font-size: 24px;
      font-weight: 500;
      color: #1d1d1f;
    }

    .app-tagline {
      font-size: 16px;
      font-weight: 400;
      color: #6e6e73;
      line-height: 1.4;
    }

    .app-row svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      color: #86868b;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), color 0.25s;
    }

    .app-row:hover svg {
      transform: translate(2px, -2px);
      color: #1d1d1f;
    }

    .footer {
      display: flex;
      flex-direction: column;
      gap: 48px;
      align-items: center;
      margin: 0 64px 64px;
      padding: 48px;
      background: #000000;
      border-radius: 28px;
      corner-shape: squircle;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .link-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }

    .link-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .link-label {
      font-size: 14px;
      font-weight: 500;
      color: #86868b;
    }

    .link-col a {
      font-size: 24px;
      font-weight: 500;
      color: #f5f5f7;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.15s;
    }

    .link-col a:hover { opacity: 0.4; }

    .link-col a svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .link-col a:hover svg { transform: translate(2px, -2px); }

    .footer-divider {
      height: 1px;
      background: #424245;
      width: 100%;
      flex-shrink: 0;
    }

    .footer-credit {
      font-size: 12px;
      color: #86868b;
      line-height: 1.5;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .footer-credit svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .hero {
        padding: 0 24px;
      }

      h1 {
        font-size: 13vw;
      }

      .intro {
        font-size: 16px;
      }

      .apps {
        padding: 48px 24px;
      }

      .app-row {
        gap: 16px;
        padding: 16px;
        border-radius: 20px;
      }

      .app-icon {
        width: 48px;
        height: 48px;
      }

      .app-name {
        font-size: 20px;
      }

      .app-tagline {
        font-size: 14px;
      }

      .footer {
        margin: 0 24px 48px;
        padding: 32px 24px;
        gap: 40px;
        border-radius: 24px;
      }

      .footer-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 40px;
      }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1     { animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
    .intro { animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s backwards; }

    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>trevor welsh</h1>
    <p class="intro">Interface designer, app maker, and spaceflight enthusiast.</p>
  </div>

  <div class="apps reveal">
    <span class="section-label">Apps</span>
    <div class="app-list">
      <a class="app-row" href="https://apps.apple.com/app/apple-store/id6468926207?pt=123932392&amp;ct=tw&amp;mt=8" target="_blank" rel="noopener">
        <img class="app-icon" src="apps/l8r.png" alt="L8R app icon" />
        <span class="app-text">
          <span class="app-name">L8R</span>
          <span class="app-tagline">A digital film camera on your iPhone</span>
        </span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
      <a class="app-row" href="https://apps.apple.com/app/apple-store/id6788937279?pt=123932392&amp;ct=tw&amp;mt=8" target="_blank" rel="noopener">
        <img class="app-icon" src="apps/gofly.png" alt="GoFly app icon" />
        <span class="app-text">
          <span class="app-name">GoFly</span>
          <span class="app-tagline">The E6B flight computer that teaches you</span>
        </span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
      <a class="app-row" href="https://apps.apple.com/app/apple-store/id6781954982?pt=123932392&amp;ct=tw&amp;mt=8" target="_blank" rel="noopener">
        <img class="app-icon" src="apps/sunny.png" alt="Sunny app icon" />
        <span class="app-text">
          <span class="app-name">Sunny</span>
          <span class="app-tagline">A simple, beautiful light meter</span>
        </span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>
  </div>

  <footer class="footer reveal">
    <div class="footer-row">
      <div class="link-col">
        <span class="link-label">Work</span>
        <div class="link-list">
          <a href="/design">
            ux/ui design
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>
      <div class="link-col">
        <span class="link-label">Connect</span>
        <div class="link-list">
          <a href="https://x.com/trevorcreates" target="_blank" rel="noopener">
            x
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
          <a href="mailto:studio@trevorwelsh.com">
            email
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>
    </div>
    <div class="footer-divider"></div>
    <p class="footer-credit">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      California
    </p>
  </footer>

  <script>
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
  </script>
</body>
</html>
