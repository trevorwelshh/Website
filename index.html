<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Trevor Welsh</title>
  <meta name="description" content="Trevor Welsh designs and builds apps for iPhone and Mac, including Cineica, GoFly, Folders, Hover, L8R and Sunny." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="canonical" href="https://trevorwelsh.com/" />
  <meta name="theme-color" content="#f5f5f3" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Trevor Welsh" />
  <meta property="og:description" content="Interface designer, app maker, and spaceflight enthusiast." />
  <meta property="og:url" content="https://trevorwelsh.com/" />
  <meta property="og:image" content="https://trevorwelsh.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1d1d1f;
      --ink-2: #6e6e73;
      --ink-3: #a1a1a6;
      --paper: #f5f5f3;
      --rule: #d9d9d6;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--paper);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 500;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }

    a { color: inherit; text-decoration: none; }

    .viewport {
      position: fixed;
      inset: 0;
      cursor: grab;
      touch-action: none;
      overflow: hidden;
      outline: none;
    }

    .viewport.dragging { cursor: grabbing; }

    .dots {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(100% + 256px);
      height: calc(100% + 256px);
      background-image: radial-gradient(circle, var(--rule) 1px, transparent 1.2px);
      pointer-events: none;
      will-change: transform;
    }

    .world {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
    }

    .world.moving { will-change: transform; }

    .item {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 16px;
      user-select: none;
      -webkit-user-select: none;
    }

    .item img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .frame img {
      width: calc((1 + 2 * var(--p)) * 100%);
      max-width: none;
      margin: calc(var(--p) * -100%);
    }




    .device { gap: 28px; }

    .caption {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: baseline;
      gap: 4px 0;
      padding-top: 12px;
      border-top: 1px solid var(--ink);
      font-size: 14px;
      line-height: 1.35;
    }

    .caption .no { color: var(--ink-3); }
    .caption .name { color: var(--ink); }
    .caption .meta { grid-column: 2 / 4; color: var(--ink-2); font-weight: 400; }

    .caption a {
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.3s;
    }

    .caption a:hover { color: var(--ink); }
    .caption a svg { width: 13px; height: 13px; }

    .title { align-items: center; text-align: center; }

    .title h1 {
      font-size: 220px;
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 0.9;
      white-space: nowrap;
    }

    .title p {
      font-size: 34px;
      font-weight: 400;
      color: var(--ink-2);
      line-height: 1.3;
      max-width: 820px;
      margin-top: 28px;
    }


    .card {
      background: #1d1d1f;
      color: #f5f5f7;
      border-radius: 44px;
      corner-shape: squircle;
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 16px;
      color: #86868b;
    }

    .card-head b { font-size: 56px; font-weight: 500; letter-spacing: -0.03em; color: #f5f5f7; }

    .tiles {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 36px;
      padding: 28px 32px;
      background: #2c2c2e;
      border-radius: 28px;
      corner-shape: squircle;
      transition: transform 0.35s var(--ease), background 0.35s;
    }

    .tile:hover { transform: scale(1.015); background: #3a3a3c; }

    .tile .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      color: #86868b;
      font-weight: 400;
    }

    .tile .top svg { width: 28px; height: 28px; color: #86868b; transition: transform 0.35s var(--ease), color 0.35s; }
    .tile:hover .top svg { transform: translate(3px, -3px); color: #f5f5f7; }

    .tile .big { font-size: 34px; letter-spacing: -0.02em; line-height: 1.15; }

    .card .where {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #86868b;
      font-weight: 400;
    }

    .card .where svg { width: 14px; height: 14px; }

    .chrome {
      position: fixed;
      z-index: 2;
      font-size: 13px;
      pointer-events: none;
    }

    .chrome > * { pointer-events: auto; }

    .masthead {
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 24px 28px;
      padding-top: max(24px, env(safe-area-inset-top));
    }

    .masthead .mark { font-size: 15px; letter-spacing: -0.01em; }
    .masthead nav { display: flex; gap: 24px; }

    .chrome button {
      font: inherit;
      color: var(--ink);
      background: none;
      border: 0;
      cursor: pointer;
    }

    .chrome a, .chrome button { transition: color 0.3s; }
    .chrome a:hover, .chrome button:hover { color: var(--ink-2); }

    .status {
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 28px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      color: var(--ink-2);
    }

    .readout {
      display: flex;
      gap: 16px;
      font-weight: 400;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      outline: 1px solid rgba(0, 0, 0, 0.06);
    }

    .zoom {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 999px;
      padding: 4px;
      outline: 1px solid rgba(0, 0, 0, 0.06);
    }

    .zoom button {
      min-width: 36px;
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 15px;
    }

    .zoom button:hover { background: rgba(0, 0, 0, 0.05); color: var(--ink); }
    .zoom .fit { font-size: 13px; }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 28px;
      bottom: max(28px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 2;
      font-size: 13px;
      color: var(--ink-2);
      font-weight: 400;
      pointer-events: none;
      transition: opacity 0.6s;
    }

    .hint.gone { opacity: 0; }

    .index {
      position: fixed;
      z-index: 3;
      top: 64px;
      right: 20px;
      width: 300px;
      max-height: calc(100% - 140px);
      overflow: auto;
      background: rgba(255, 255, 255, 0.86);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      border-radius: 22px;
      corner-shape: squircle;
      outline: 1px solid rgba(0, 0, 0, 0.06);
      padding: 8px;
      opacity: 0;
      transform: translateY(-8px) scale(0.98);
      transform-origin: top right;
      pointer-events: none;
      transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
    }

    .index.open { opacity: 1; transform: none; pointer-events: auto; }

    .index button {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      width: 100%;
      text-align: left;
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      background: none;
      border: 0;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
    }

    .index button:hover { background: rgba(0, 0, 0, 0.04); }
    .index button span:first-child { color: var(--ink-3); }
    .index button span:last-child { color: var(--ink-2); font-weight: 400; font-size: 12px; }

    a:focus-visible, button:focus-visible {
      outline: 2px solid #0071e3;
      outline-offset: 3px;
      border-radius: 6px;
    }

    @media (max-width: 640px) {
      .masthead { padding: 18px 18px; padding-top: max(18px, env(safe-area-inset-top)); }
      .masthead nav { gap: 16px; }
      .status { padding: 16px 18px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
      .readout { display: none; }
      .status { justify-content: flex-end; }
      .hint { bottom: 76px; }
      .index { left: 12px; right: 12px; width: auto; top: auto; bottom: 72px; transform-origin: bottom center; }
    }
  </style>
</head>
<body>

  <header class="chrome masthead">
    <a class="mark" href="#" data-go="title">trevor welsh</a>
    <nav>
      <button type="button" class="index-toggle" aria-expanded="false" aria-controls="index">Index</button>
      <button type="button" data-go="contact">Contact</button>
    </nav>
  </header>

  <div class="index" id="index" role="menu"></div>

  <main class="viewport" tabindex="0" aria-label="Canvas of apps and interface work. Drag to move, pinch or use plus and minus to zoom.">
    <div class="dots"></div>
    <div class="world"></div>
  </main>

  <footer class="chrome status">
    <div class="readout"><span class="coords">x 0 y 0</span><span class="pct">100%</span></div>
    <div class="zoom">
      <button type="button" class="out" aria-label="Zoom out">−</button>
      <button type="button" class="fit">Fit</button>
      <button type="button" class="in" aria-label="Zoom in">+</button>
    </div>
  </footer>

  <p class="hint">Drag to explore</p>

  <script>
    const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="8 7 17 7 17 16"/></svg>';
    const pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
    const store = id => `https://apps.apple.com/app/apple-store/id${id}?pt=123932392&ct=tw&mt=8`;

    const items = [
      { id: 'title', kind: 'title', w: 1300 },

      { id: 'cineica', kind: 'icon', a: 210, w: 300, ar: '1138 / 1138', p: 0.2409, img: 'icon-cineica', name: 'Cineica', meta: 'Cinematic photo camera', href: store(6829584713) },
      { id: 'gofly', kind: 'icon', a: -30, w: 300, ar: '1138 / 1138', p: 0.2409, img: 'icon-gofly', name: 'GoFly', meta: 'E6B flight computer', href: store(6788937279) },
      { id: 'folders', kind: 'icon mac', a: -90, w: 300, ar: '924 / 924', p: 0.2404, img: 'icon-folders', name: 'Folders', meta: 'Catalog of every drive', href: 'https://foldersformac.com' },
      { id: 'hover', kind: 'icon', a: 150, w: 300, ar: '1138 / 1138', p: 0.2409, img: 'icon-hover', name: 'Hover', meta: 'Part 107 test prep', href: store(6824683898) },
      { id: 'l8r', kind: 'icon', a: 30, w: 300, ar: '1138 / 1138', p: 0.2409, img: 'icon-l8r', name: 'L8R', meta: 'Vintage film camera', href: store(6468926207) },
      { id: 'sunny', kind: 'icon', a: 90, w: 300, ar: '1138 / 1138', p: 0.2409, img: 'icon-sunny', name: 'Sunny', meta: 'Light meter', href: store(6781954982) },

      { id: 'folders-display', kind: 'device', w: 900, ar: '2040 / 1650', p: 0.105, img: 'dev-folders-display', name: 'Library', app: 'Folders', meta: 'Studio Display' },
      { id: 'gofly-crosswind', kind: 'device', w: 300, ar: '976 / 1612', p: 0.3133, img: 'dev-gofly-crosswind', name: 'Crosswind', app: 'GoFly', meta: 'iPhone' },
      { id: 'gofly-tas', kind: 'device', w: 300, ar: '976 / 1612', p: 0.3133, img: 'dev-gofly-tas', name: 'True airspeed', app: 'GoFly', meta: 'iPhone' },
      { id: 'gofly-metar', kind: 'device', w: 300, ar: '976 / 1612', p: 0.3133, img: 'dev-gofly-metar', name: 'METAR decoder', app: 'GoFly', meta: 'iPhone' },
      { id: 'gofly-wb', kind: 'device', w: 300, ar: '976 / 1612', p: 0.3133, img: 'dev-gofly-wb', name: 'Weight and balance', app: 'GoFly', meta: 'iPhone' },
      { id: 'l8r-camera', kind: 'device', w: 300, ar: '976 / 1617', p: 0.3133, img: 'dev-l8r-camera', name: 'Camera', app: 'L8R', meta: 'iPhone' },
      { id: 'l8r-filmlab', kind: 'device', w: 300, ar: '976 / 1617', p: 0.3133, img: 'dev-l8r-filmlab', name: 'Film Lab', app: 'L8R', meta: 'iPhone' },
      { id: 'l8r-redevelop', kind: 'device', w: 300, ar: '976 / 1617', p: 0.3133, img: 'dev-l8r-redevelop', name: 'Redevelop', app: 'L8R', meta: 'iPhone' },
      { id: 'contact', kind: 'contact', w: 600 },
      { id: 'hover-study', kind: 'device', w: 300, ar: '976 / 1616', p: 0.3133, img: 'dev-hover-study', name: 'Study', app: 'Hover', meta: 'iPhone' },
      { id: 'hover-exam', kind: 'device', w: 300, ar: '976 / 1616', p: 0.3133, img: 'dev-hover-exam', name: 'Practice exam', app: 'Hover', meta: 'iPhone' },
      { id: 'hover-airspace-duo', kind: 'device', w: 314, ar: '1024 / 1277', p: 0.3, img: 'dev-hover-airspace-duo', name: 'Airspace', app: 'Hover', meta: 'iPhone Duo' },
      { id: 'hover-log', kind: 'device', w: 300, ar: '976 / 1616', p: 0.3133, img: 'dev-hover-log', name: 'Flight log', app: 'Hover', meta: 'iPhone' },
      { id: 'cineica-camera', kind: 'device', w: 300, ar: '976 / 1616', p: 0.3133, img: 'dev-cineica-camera', name: 'Camera', app: 'Cineica', meta: 'iPhone' },
      { id: 'cineica-camera-duo', kind: 'device', w: 314, ar: '1024 / 1277', p: 0.3, img: 'dev-cineica-camera-duo', name: 'Camera', app: 'Cineica', meta: 'iPhone Duo' },
      { id: 'cineica-wb', kind: 'device', w: 300, ar: '976 / 1616', p: 0.3133, img: 'dev-cineica-wb', name: 'White balance', app: 'Cineica', meta: 'iPhone' },
      { id: 'cineica-style-duo', kind: 'device', w: 314, ar: '1024 / 1277', p: 0.3, img: 'dev-cineica-style-duo', name: 'Style', app: 'Cineica', meta: 'iPhone Duo' }
    ];


    const world = document.querySelector('.world');
    const viewport = document.querySelector('.viewport');
    const index = document.querySelector('.index');
    let figure = 0;

    items.forEach(it => {
      const el = document.createElement(it.kind === 'title' ? 'section' : 'figure');
      el.className = `item ${it.kind}`;
      el.id = it.id;
      el.style.width = `${it.w}px`;

      if (it.kind === 'title') {
        el.innerHTML = '<h1>Trevor Welsh</h1><p>Interface designer, app maker, and spaceflight enthusiast.</p>';
      } else if (it.kind === 'contact') {
        el.innerHTML = `<div class="card">
            <div class="card-head"><b>Say hello</b><span>Contact</span></div>
            <div class="tiles">
              <a class="tile" href="mailto:studio@trevorwelsh.com"><span class="top">Email ${arrow}</span><span class="big">studio@trevorwelsh.com</span></a>
              <a class="tile" href="https://x.com/trevor2893438" target="_blank" rel="noopener"><span class="top">X ${arrow}</span><span class="big">@trevor2893438</span></a>
              <a class="tile" href="/design"><span class="top">Work ${arrow}</span><span class="big">ux/ui design</span></a>
            </div>
            <p class="where">${pin} California</p>
          </div>`;
      } else {
        figure += 1;
        const no = String(figure).padStart(2, '0');
        const link = it.href ? `<a href="${it.href}" target="_blank" rel="noopener">${it.kind.includes('mac') ? 'Website' : 'App Store'} ${arrow}</a>` : '';
        const name = it.app ? `${it.name}, ${it.app}` : it.name;
        el.innerHTML = `<div class="frame"><img src="img/${it.img}.webp?v=2" alt="${name}" draggable="false" style="aspect-ratio: ${it.ar}; --p: ${it.p}" /></div>
          <figcaption class="caption"><span class="no">${no}</span><span class="name">${name}</span>${link}<span class="meta">${it.meta}</span></figcaption>`;

        const b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('role', 'menuitem');
        b.innerHTML = `<span>${no}</span><span>${name}</span><span>${it.kind === 'device' ? it.meta : 'icon'}</span>`;
        b.addEventListener('click', () => { toggleIndex(false); flyTo(it.id); });
        index.appendChild(b);
      }
      world.appendChild(el);
    });

    const place = (el, cx, cy) => {
      el.style.left = `${Math.round(cx - el.offsetWidth / 2)}px`;
      el.style.top = `${Math.round(cy - el.offsetHeight / 2)}px`;
    };

    place(document.getElementById('title'), 0, 0);

    const inner = { x: 1080, y: 660 };
    items.filter(it => it.kind.startsWith('icon')).forEach(it => {
      const a = it.a * Math.PI / 180;
      place(document.getElementById(it.id), inner.x * Math.cos(a), inner.y * Math.sin(a));
    });

    const ring = items.filter(it => it.kind === 'device' || it.kind === 'contact').map(it => document.getElementById(it.id));
    const outer = { x: 1950, y: 1580 };
    const samples = 1440;
    const arc = [0];
    for (let k = 1; k <= samples; k++) {
      const a0 = (k - 1) / samples * 2 * Math.PI - Math.PI / 2, a1 = k / samples * 2 * Math.PI - Math.PI / 2;
      arc.push(arc[k - 1] + Math.hypot(outer.x * (Math.cos(a1) - Math.cos(a0)), outer.y * (Math.sin(a1) - Math.sin(a0))));
    }
    const total = arc[samples];
    const angleAt = d => {
      d = ((d % total) + total) % total;
      let k = arc.findIndex(v => v >= d);
      return (Math.max(k, 1) / samples) * 2 * Math.PI - Math.PI / 2;
    };
    let angles = ring.map((_, i) => i / ring.length * 2 * Math.PI - Math.PI / 2);
    for (let pass = 0; pass < 6; pass++) {
      const foot = ring.map((el, i) => {
        const tx = -outer.x * Math.sin(angles[i]), ty = outer.y * Math.cos(angles[i]), len = Math.hypot(tx, ty);
        return Math.abs(el.offsetWidth * tx / len) + Math.abs(el.offsetHeight * ty / len);
      });
      const gap = (total - foot.reduce((a, b) => a + b, 0)) / ring.length;
      let d = -foot[0] / 2 - gap / 2;
      angles = foot.map(f => { const c = d + gap / 2 + f / 2; d += f + gap; return angleAt(c); });
    }
    ring.forEach((el, i) => place(el, outer.x * Math.cos(angles[i]), outer.y * Math.sin(angles[i])));

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const view = { x: 0, y: 0, s: 1 };
    const minS = 0.08, maxS = 3;
    let anim = null;

    const dots = document.querySelector('.dots');
    let rest = 0;
    const render = () => {
      world.style.transform = `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.s})`;
      const g = 32 * view.s * (view.s < 0.5 ? 2 : 1) * (view.s < 0.25 ? 2 : 1);
      const size = `${g}px ${g}px`;
      if (dots.style.backgroundSize !== size) dots.style.backgroundSize = size;
      dots.style.transform = `translate3d(${(view.x % g) - g}px, ${(view.y % g) - g}px, 0)`;
      world.classList.add('moving');
      clearTimeout(rest);
      rest = setTimeout(() => world.classList.remove('moving'), 180);
      const cx = (innerWidth / 2 - view.x) / view.s, cy = (innerHeight / 2 - view.y) / view.s;
      document.querySelector('.coords').textContent = `x ${Math.round(cx)}  y ${Math.round(cy)}`;
      document.querySelector('.pct').textContent = `${Math.round(view.s * 100)}%`;
    };

    const clampS = s => Math.min(maxS, Math.max(minS, s));

    const zoomAt = (px, py, s) => {
      s = clampS(s);
      view.x = px - (px - view.x) * (s / view.s);
      view.y = py - (py - view.y) * (s / view.s);
      view.s = s;
    };

    const animateTo = (target, dur = 900) => {
      cancelAnimationFrame(anim);
      if (reduce) { Object.assign(view, target); render(); return; }
      const from = { ...view }, t0 = performance.now();
      const ls0 = Math.log(from.s), ls1 = Math.log(target.s);
      const step = now => {
        const p = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - p, 4);
        const s = Math.exp(ls0 + (ls1 - ls0) * e);
        const fcx = (innerWidth / 2 - from.x) / from.s, fcy = (innerHeight / 2 - from.y) / from.s;
        const tcx = (innerWidth / 2 - target.x) / target.s, tcy = (innerHeight / 2 - target.y) / target.s;
        const cx = fcx + (tcx - fcx) * e, cy = fcy + (tcy - fcy) * e;
        view.s = s;
        view.x = innerWidth / 2 - cx * s;
        view.y = innerHeight / 2 - cy * s;
        render();
        if (p < 1) anim = requestAnimationFrame(step);
      };
      anim = requestAnimationFrame(step);
    };

    const frameBox = (box, pad) => {
      const w = innerWidth - pad * 2, h = innerHeight - pad * 2 - 80;
      const s = clampS(Math.min(w / box.w, h / box.h, 1));
      return { s, x: innerWidth / 2 - (box.x + box.w / 2) * s, y: innerHeight / 2 + 10 - (box.y + box.h / 2) * s };
    };

    const boxOf = el => ({ x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight });

    const allBox = () => {
      const bs = [...world.children].map(boxOf);
      const x = Math.min(...bs.map(b => b.x)), y = Math.min(...bs.map(b => b.y));
      return { x, y, w: Math.max(...bs.map(b => b.x + b.w)) - x, h: Math.max(...bs.map(b => b.y + b.h)) - y };
    };

    const fit = () => animateTo(frameBox(allBox(), innerWidth < 640 ? 18 : 60));

    const flyTo = id => {
      const el = document.getElementById(id);
      const target = frameBox(boxOf(el), innerWidth < 640 ? 24 : 120);
      target.s = Math.min(target.s, el.classList.contains('icon') ? 1.4 : 1);
      const b = boxOf(el);
      target.x = innerWidth / 2 - (b.x + b.w / 2) * target.s;
      target.y = innerHeight / 2 + 10 - (b.y + b.h / 2) * target.s;
      animateTo(target);
      hideHint();
    };

    const hint = document.querySelector('.hint');
    const hideHint = () => hint.classList.add('gone');

    const pointers = new Map();
    let last = null, moved = 0, vel = { x: 0, y: 0 }, lastT = 0, pinch = null, inertia = null;

    viewport.addEventListener('pointerdown', e => {
      if (e.target.closest('a')) return;
      cancelAnimationFrame(anim);
      cancelAnimationFrame(inertia);
      viewport.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) {
        last = { x: e.clientX, y: e.clientY };
        moved = 0;
        vel = { x: 0, y: 0 };
        lastT = performance.now();
        viewport.classList.add('dragging');
      } else if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      }
    });

    viewport.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2 && pinch) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        view.x += mx - pinch.mx;
        view.y += my - pinch.my;
        zoomAt(mx, my, view.s * d / pinch.d);
        pinch = { d, mx, my };
        moved += 10;
        render();
        hideHint();
      } else if (pointers.size === 1 && last) {
        const dx = e.clientX - last.x, dy = e.clientY - last.y, now = performance.now();
        view.x += dx;
        view.y += dy;
        moved += Math.abs(dx) + Math.abs(dy);
        const dt = Math.max(1, now - lastT);
        vel = { x: dx / dt * 16, y: dy / dt * 16 };
        last = { x: e.clientX, y: e.clientY };
        lastT = now;
        render();
        if (moved > 6) hideHint();
      }
    });

    const release = e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.delete(e.pointerId);
      if (pointers.size === 1) {
        const [p] = pointers.values();
        last = { x: p.x, y: p.y };
        pinch = null;
        return;
      }
      if (pointers.size) return;
      viewport.classList.remove('dragging');
      pinch = null;
      if (moved < 6) {
        const hit = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList?.contains('item') && el.tagName === 'FIGURE');
        if (hit) flyTo(hit.id);
        return;
      }
      if (reduce || performance.now() - lastT > 80) return;
      const glide = () => {
        vel.x *= 0.92;
        vel.y *= 0.92;
        view.x += vel.x;
        view.y += vel.y;
        render();
        if (Math.abs(vel.x) + Math.abs(vel.y) > 0.3) inertia = requestAnimationFrame(glide);
      };
      inertia = requestAnimationFrame(glide);
    };

    viewport.addEventListener('pointerup', release);
    viewport.addEventListener('pointercancel', release);

    viewport.addEventListener('wheel', e => {
      e.preventDefault();
      cancelAnimationFrame(anim);
      cancelAnimationFrame(inertia);
      const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
      if (e.ctrlKey || e.metaKey) {
        zoomAt(e.clientX, e.clientY, view.s * Math.exp(-e.deltaY * unit * 0.01));
      } else {
        view.x -= e.deltaX * unit;
        view.y -= e.deltaY * unit;
      }
      render();
      hideHint();
    }, { passive: false });

    let gestureBase = 1;
    viewport.addEventListener('gesturestart', e => {
      e.preventDefault();
      cancelAnimationFrame(anim);
      cancelAnimationFrame(inertia);
      gestureBase = view.s;
    });
    viewport.addEventListener('gesturechange', e => {
      e.preventDefault();
      if (pointers.size > 1) return;
      zoomAt(e.clientX, e.clientY, gestureBase * e.scale);
      render();
      hideHint();
    });
    viewport.addEventListener('gestureend', e => e.preventDefault());

    const zoomCenter = f => animateTo((() => {
      const s = clampS(view.s * f), cx = innerWidth / 2, cy = innerHeight / 2;
      return { s, x: cx - (cx - view.x) * (s / view.s), y: cy - (cy - view.y) * (s / view.s) };
    })(), 450);

    document.querySelector('.zoom .in').addEventListener('click', () => zoomCenter(1.5));
    document.querySelector('.zoom .out').addEventListener('click', () => zoomCenter(1 / 1.5));
    document.querySelector('.zoom .fit').addEventListener('click', fit);

    viewport.addEventListener('keydown', e => {
      const step = 120;
      const keys = {
        ArrowLeft: () => animateTo({ ...view, x: view.x + step }, 300),
        ArrowRight: () => animateTo({ ...view, x: view.x - step }, 300),
        ArrowUp: () => animateTo({ ...view, y: view.y + step }, 300),
        ArrowDown: () => animateTo({ ...view, y: view.y - step }, 300),
        '+': () => zoomCenter(1.5),
        '=': () => zoomCenter(1.5),
        '-': () => zoomCenter(1 / 1.5),
        '0': fit
      };
      if (keys[e.key]) { e.preventDefault(); keys[e.key](); hideHint(); }
    });

    const toggle = document.querySelector('.index-toggle');
    const toggleIndex = open => {
      index.classList.toggle('open', open);
      if (open) hideHint();
      toggle.setAttribute('aria-expanded', String(open));
    };
    toggle.addEventListener('click', () => toggleIndex(!index.classList.contains('open')));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleIndex(false); });
    viewport.addEventListener('pointerdown', () => toggleIndex(false));

    document.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      toggleIndex(false);
      a.dataset.go === 'title' ? fit() : flyTo(a.dataset.go);
    }));

    const opening = () => {
      const ids = innerWidth < 640 ? ['title'] : ['title', 'cineica', 'gofly', 'folders', 'hover', 'l8r', 'sunny'];
      const els = ids.map(id => boxOf(document.getElementById(id)));
      const x = Math.min(...els.map(b => b.x)), y = Math.min(...els.map(b => b.y));
      return { x, y, w: Math.max(...els.map(b => b.x + b.w)) - x, h: Math.max(...els.map(b => b.y + b.h)) - y };
    };
    const settle = () => { Object.assign(view, frameBox(opening(), innerWidth < 640 ? 18 : 80)); render(); };
    settle();
    addEventListener('load', () => { if (!moved && !pointers.size) settle(); });
    addEventListener('resize', render);
  </script>
</body>
</html>
